train:
  seed: 42
  log_interval: 100  # Log every 100 steps
  val_interval: 1500
  cuda_deterministic: False
  mask_edge: False
  mask_atom: True
  mask_fragment: True
  mask_rsd: True
  mask_rate: 0.6 # how many elements in a peptide should be masked.
  batch_size: 128
  hid_dim: 300
  act: "relu"
  depth: 5
  # num_task: 1
  atom_dim: 42 # do not change
  bond_dim: 14 # do not change
  pharm_dim: 196 # do not change
  rsd_dim: 300
  reac_dim: 14
  num_layer: 5
  lr: 0.0001
  decay: 0
  epochs: 1
  patience: 5
  frag_method: "FraSCESS"
  train_tag: "s1_pretrain"
  sq_embed: "CovTrans" # CovTrans or ESM2
  decoder_type: "HAN" # MLP, HGC, HAN
  detach_gnn: False
  
data:
  vocablist: tokenizer/vocablist/vocab_1.json
  train_sdf: datasets/unlabel_train_1778734.smi
  valid_sdf: datasets/unlabel_val_98818.smi
  test_sdf: datasets/unlabel_test_98818.smi
  tmp_dir: ./tmp/pretrain
  chunk_size: 2000
  # save_path: "/home/ubuntu/project/amphgt_refactor/datasets/split/pretrain"
  num_workers: 2

logger:
  log: True
  log_dir: "${output_dir}/${now:%m-%d-%H-%M}"
  log_per_steps: 5
  tracking_uri: "${output_dir}/mlflow_tracking"
  mlflow_exp_name: "Pretraining_FraSCESS"
  test_run: False

mode:
  nni: false  # If using NNI for hyperparameter tuning
  ddp: false   # Distributed Data Parallel mode
