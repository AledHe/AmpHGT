train:
  seed: 42
  log_interval: 5  # Log every 100 steps
  # val_interval: 1000
  cuda_deterministic: False
  batch_size: 128
  hid_dim: 300
  act: "relu"
  depth: 5
  num_task: 1
  atom_dim: 42 # do not change
  bond_dim: 14 # do not change
  pharm_dim: 196 # do not change
  reac_dim: 14
  num_layer: 5
  num_tasks: 1
  frag_method: "FraSCESS"
  train_tag: "s3_inference"
  view: "apjr"
  sq_embed: "CovTrans" # CovTrans or ESM2
  load_pretrained: False # if not, train from scratch on finetune data
  readout: "none" # "att": HierAttnReadout, "gru": GRUReadout, "": no readout
  pooling: "mean" # works when not gru/att readout, mean, max, sum
  fusion: "gate"
  tcn: False
  unlabel_checkpoint_path: ""
  checkpoint_path: 
  detach_gnn: False
  return_intermediate: False

data:
  vocablist: tokenizer/vocablist/vocab_1.json
  test_sdf_pos: datasets_xuamp/XU_AMP_positive.smi
  test_sdf_neg: datasets_xuamp/XU_nonAMP_negative.smi
  tmp_dir: ./tmp/finetune_binary
  chunk_size: 2000
  # save_path: "/home/ubuntu/project/amphgt_refactor/datasets/split/pretrain"
  num_workers: 2

umap:
  n_neighbors: 15
  min_dist: 0.1
  out_path: "${output_dir}/${now:%m-%d-%H-%M}"


logger:
  log: True
  log_dir: "${output_dir}/${now:%m-%d-%H-%M}"
  test_run: False

mode:
  nni: false  # If using NNI for hyperparameter tuning
  ddp: false   # Distributed Data Parallel mode