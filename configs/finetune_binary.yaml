train:
  seed: 42
  log_interval: 5  # Log every 100 steps
  # val_interval: 1000
  cuda_deterministic: False
  mask_edge: False
  mask_atom: True
  mask_fragment: True
  mask_rate: 0.6 # how many atoms in a peptide should be masked.
  batch_size: 128
  hid_dim: 300
  act: "relu"
  depth: 5
  num_task: 1
  atom_dim: 42 # do not change
  bond_dim: 14 # do not change
  pharm_dim: 196 # do not change
  reac_dim: 14
  num_layer: 5
  num_tasks: 1
  lr: 0.001
  decay: 0
  epochs: 200
  patience: 10
  frag_method: "FraSCESS"
  train_tag: "s2_finetune"
  load_pretrained: True # if not, train from scratch on finetune data
  readout: "gru" # "att": HierAttnReadout, "gru": GRUReadout, "": no readout
  pooling: "mean" # works when not gru/att readout, mean, max, sum
  checkpoint_path: out_pretrain/02-16-00-07/checkpoint_epoch_0_step_3000/model.pt

data:
  vocablist: tokenizer/vocablist/vocab_1.json
  train_sdf_pos: datasets_xuamp/XU_train_train_positive.smi
  valid_sdf_pos: datasets_xuamp/XU_train_val_positive.smi
  test_sdf_pos: datasets/XU_AMP_positive.smi
  train_sdf_neg: datasets_xuamp/XU_train_train_negative.smi
  valid_sdf_neg: datasets_xuamp/XU_train_val_negative.smi
  test_sdf_neg: datasets/XU_nonAMP_negative.smi
  tmp_dir: ./tmp/finetune_binary
  chunk_size: 2000
  # save_path: "/home/ubuntu/project/amphgt_refactor/datasets/split/pretrain"
  num_workers: 2

logger:
  log: True
  log_dir: "${output_dir}/${now:%m-%d-%H-%M}"
  log_per_steps: 5
  tracking_uri: "${output_dir}/mlflow_tracking"
  mlflow_exp_name: "Finetune_FraSCESS"
  test_run: False

mode:
  nni: false  # If using NNI for hyperparameter tuning
  ddp: false   # Distributed Data Parallel mode
